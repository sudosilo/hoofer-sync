<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#eef6fe">
<title>Hoofer Sync</title>
<!-- hoofer-sync v2. Band dance floor: every phone in a Stompbox Lab band room gets a dancer on one shared stage. -->
<style>
:root{
  --ink:#0b0f14; --paper:#ffffff; --wall:#eef6fe; --blue:#1484e0; --blue2:#0b5fae; --text:#0a2542; --mute:#5b7390;
  --drums:#e8542a; --bass:#1484e0; --lead:#0e9a64; --pad:#8a4fd6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background-color:#eef6fe!important;color-scheme:only light}
html,body{height:100%;background:#eef6fe!important;color:#0a2542!important;font-family:"Courier New",Courier,monospace;overflow:hidden}
button,input{font-family:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;background:#eef6fe}

.bar{background:#ffffff;border-bottom:3px solid var(--ink);padding:6px 8px;display:flex;flex-direction:column;gap:6px;position:relative;z-index:5}
.row{display:flex;align-items:center;gap:6px}
.logo{font-family:Impact,"Arial Narrow",sans-serif;font-size:1.35rem;letter-spacing:.06em;color:var(--blue);line-height:1;text-shadow:2px 2px 0 var(--ink)}
.chip{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border:2px solid var(--ink);background:#ffffff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip[data-s="live"]{background:#d6f5e6}
.chip[data-s="demo"]{background:#dcecfb}
.chip[data-s="wait"]{background:#fde3d9}
.grow{flex:1;min-width:0}
.btn{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border:2px solid var(--ink);background:#ffffff;cursor:pointer;touch-action:manipulation;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.blue{background:var(--blue);color:#ffffff}
.btn.on{background:#0e9a64;color:#ffffff}
.btn:disabled{opacity:.35}
.btn.sq{padding:8px 0;width:38px;text-align:center}
.room{flex:1;min-width:0;font-size:.85rem;font-weight:700;padding:8px;border:2px solid var(--ink);background:#ffffff;text-transform:lowercase}
.tempo{font-family:Impact,"Arial Narrow",sans-serif;font-size:1.15rem;min-width:64px;text-align:center;color:var(--text)}

.menu{position:absolute;top:100%;right:6px;width:min(320px,calc(100vw - 12px));background:#ffffff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px;display:none;flex-direction:column;gap:8px;z-index:20}
.menu.open{display:flex}
.menu h3{font-family:Impact,"Arial Narrow",sans-serif;font-weight:400;font-size:.95rem;letter-spacing:.08em;color:var(--blue)}
.menu p{font-size:.7rem;color:var(--mute);line-height:1.35}
.grooves{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grooves .btn.sel{background:var(--blue);color:#ffffff}
.menu a.btn{text-decoration:none;color:var(--text);text-align:center}

.stage{flex:1;position:relative;min-height:0;background:#eef6fe;overflow:hidden}
#floor{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.fs-exit{position:absolute;top:10px;right:10px;z-index:8;display:none}
.fs-open{position:absolute;top:8px;right:8px;z-index:8;padding:6px 9px;font-size:.66rem}
.stage.fs .fs-exit{display:block}
.stage.fs .fs-open{display:none}
.stage.pseudo{position:fixed;inset:0;z-index:100}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="row">
      <span class="logo">HOOFER SYNC</span>
      <span class="chip grow" id="status" data-s="demo">demo floor</span>
      <button class="btn" id="menu-btn" aria-label="Menu">&#9776;</button>
    </div>
    <div class="row">
      <input class="room" id="room-code" placeholder="band room code" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn blue" id="join">Join</button>
    </div>
    <div class="row">
      <button class="btn" id="loop">Stop</button>
      <button class="btn sq" id="bpm-dn">-</button>
      <span class="tempo" id="tempo">104</span>
      <button class="btn sq" id="bpm-up">+</button>
      <span class="grow"></span>
      <button class="btn" id="hear">Hear band</button>
    </div>
    <div class="menu" id="menu">
      <h3>GROOVE</h3>
      <div class="grooves" id="grooves"></div>
      <h3>DANCERS</h3>
      <p>Every phone in the band room gets a dancer, and each dancer moves to its own part of the loop. With nobody else in the room, the house troupe dances. Tap a dancer to change its look.</p>
      <button class="btn" id="fs-menu">Fullscreen floor</button>
      <a class="btn" href="hoofer-sync-v1-classic.html">Classic sequencer</a>
    </div>
  </div>
  <div class="stage" id="stage">
    <canvas id="floor"></canvas>
    <button class="btn fs-open" id="fs-open">&#9974; Full</button>
    <button class="btn blue fs-exit" id="fs-exit">EXIT</button>
  </div>
</div>

<script>
"use strict";
/* hoofer-sync v2
   A shared dance floor for the Stompbox Lab band room. The room loop, tempo and groove come from
   the band server and the server clock puts every screen on the same beat. The server roster lists
   every phone in the room, and each phone gets a dancer that moves to its own part of the loop.
   Choreography is picked from the bar number, the groove and the dancer, so every screen showing
   the floor shows the same dance. */

const APP="hoofer-sync",SCHEMA=2;
const SYNC_URL=new URLSearchParams(location.search).get("sync")||"wss://stompbox-lab-api-production.up.railway.app";
const SLOTS=["drums","bass","lead","pad"];
const PART_COLOR={drums:"#e8542a",bass:"#1484e0",lead:"#0e9a64",pad:"#8a4fd6"};
const CHARS=["boy","girl","robot","cat"];
const INK="#0b0f14";

/* ---------- storage ---------- */
function keep(key,value){try{if(value===undefined)return localStorage.getItem(key);localStorage.setItem(key,value)}catch(e){}return null}

/* ---------- server clock, same method as the other band apps ---------- */
function localNow(){return (window.performance&&performance.timeOrigin)?performance.timeOrigin+performance.now():Date.now()}
function createServerClock(o){
  let offset=0,synced=false,left=0,bestRtt=Infinity,bestOffset=0,stepTimer=null,repeatTimer=null;
  function adopt(){if(bestRtt===Infinity)return;offset=bestOffset;synced=true;if(o.onChange)o.onChange()}
  function step(){stepTimer=null;if(left<=0){adopt();return}left--;o.send({type:"ping",t0:localNow()});stepTimer=setTimeout(step,150)}
  function burst(n){clearTimeout(stepTimer);left=n;bestRtt=Infinity;step()}
  return {
    start(){clearInterval(repeatTimer);synced=false;burst(8);repeatTimer=setInterval(()=>burst(4),30000)},
    stop(){clearInterval(repeatTimer);clearTimeout(stepTimer);left=0;synced=false;if(o.onChange)o.onChange()},
    pong(m){const t3=localNow(),trip=t3-m.t0;if(!(trip>=0)||typeof m.t1!=="number")return;
      if(trip<bestRtt){bestRtt=trip;bestOffset=m.t1+trip/2-t3;if(!synced)adopt()}},
    now(){return localNow()+offset},
    get synced(){return synced}
  };
}

/* ---------- band socket, same message format as the other band apps ---------- */
function cleanRoom(r){return String(r||"").trim().toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,24)}
function makeId(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();let s="";for(let i=0;i<32;i++)s+=Math.floor(Math.random()*16).toString(16);return s}
function createBandSocket(o){
  let device=keep(APP+"-device-id");if(!device){device=makeId();keep(APP+"-device-id",device)}
  let room=cleanRoom(keep(APP+"-room")),ws=null,retry=0,retryTimer=null,seq=0,status="off";
  const handlers={};
  function setStatus(s){status=s;if(o.onStatus)o.onStatus(s)}
  function send(type,extra){if(ws&&ws.readyState===1){ws.send(JSON.stringify(Object.assign({type:type,app:APP,schema:SCHEMA,room:room,device:device,seq:++seq,ts:Date.now()},extra||{})));return true}return false}
  function connect(){
    clearTimeout(retryTimer);
    if(ws){const old=ws;ws=null;old.close()}
    if(!SYNC_URL||!room){setStatus("off");return}
    setStatus("connecting");
    const q="app="+encodeURIComponent(APP)+"&room="+encodeURIComponent(room)+"&device="+encodeURIComponent(device);
    let sock;try{sock=new WebSocket(SYNC_URL+(SYNC_URL.indexOf("?")<0?"?":"&")+q)}catch(e){setStatus("reconnecting");retryTimer=setTimeout(connect,3000);return}
    ws=sock;
    sock.onopen=()=>{if(ws!==sock)return;retry=0;setStatus("live");send("hello")};
    sock.onmessage=e=>{if(ws!==sock)return;let m;try{m=JSON.parse(e.data)}catch(x){return}if(m&&handlers[m.type])handlers[m.type](m)};
    sock.onerror=()=>sock.close();
    sock.onclose=()=>{if(ws!==sock)return;ws=null;setStatus("reconnecting");retryTimer=setTimeout(connect,Math.min(15000,500*Math.pow(2,retry++)))};
  }
  function leave(){clearTimeout(retryTimer);room="";keep(APP+"-room","");if(ws){const old=ws;ws=null;old.close()}setStatus("off")}
  return {on(t,fn){handlers[t]=fn},send:send,connect:connect,leave:leave,
    setRoom(r){room=cleanRoom(r);keep(APP+"-room",room);connect();return room},
    get room(){return room},get status(){return status},get device(){return device}};
}

/* ---------- loop pattern reader, same notation and bar sums as the server ---------- */
const DRUMNOTE={bd:36,sd:38,hh:42,oh:46,cp:39,ck:76,cl:77};
const SEMI={c:0,d:2,e:4,f:5,g:7,a:9,b:11};
const TOKENS=/[\[\]<>,~]|[*@]\d+(?:\.\d+)?|[^\s\[\]<>,~*@]+/g;
function tokenToNote(tok){
  if(Object.prototype.hasOwnProperty.call(DRUMNOTE,tok))return {note:DRUMNOTE[tok],drum:tok};
  const m=/^([a-g])(#|b)?(-?\d)$/.exec(tok);
  if(m)return {note:SEMI[m[1]]+(m[2]==="#"?1:m[2]==="b"?-1:0)+(+m[3]+1)*12,drum:null};
  if(/^\d{1,3}$/.test(tok)&&+tok<128)return {note:+tok,drum:null};
  return null;
}
function parsePattern(src){
  const toks=String(src||"").toLowerCase().match(TOKENS)||[];let i=0;
  function stack(close){const layers=[seq(close)];while(toks[i]===","){i++;layers.push(seq(close))}return layers.length===1?layers[0]:{t:"stack",c:layers,w:1}}
  function seq(close){const c=[];while(i<toks.length&&toks[i]!==","&&toks[i]!==close){if(toks[i]==="]"||toks[i]===">"){i++;continue}c.push(step())}return {t:"seq",c:c,w:1}}
  function step(){
    const tk=toks[i++];let n;
    if(tk==="["){n=stack("]");if(toks[i]==="]")i++}
    else if(tk==="<"){const s=seq(">");if(toks[i]===">")i++;n={t:"alt",c:s.c,w:1}}
    else{const v=tokenToNote(tk);n=v?{t:"note",v:v,w:1}:{t:"rest",w:1}}
    while(i<toks.length&&(toks[i][0]==="*"||toks[i][0]==="@")){
      const num=+toks[i].slice(1);
      if(toks[i][0]==="*"){if(num>=1&&num<=32)n={t:"fast",n:Math.round(num),c:n,w:n.w}}
      else if(num>0&&num<=16)n.w=num;
      i++;
    }
    return n;
  }
  return stack(null);
}
function walk(n,cyc,start,dur,out){
  if(n.t==="note")out.push({pos:start,dur:dur,note:n.v.note,drum:n.v.drum,vel:100});
  else if(n.t==="seq"){let total=0;for(const c of n.c)total+=c.w;let p=start;for(const c of n.c){const d=dur*c.w/total;walk(c,cyc,p,d,out);p+=d}}
  else if(n.t==="stack"){for(const c of n.c)walk(c,cyc,start,dur,out)}
  else if(n.t==="alt"){if(n.c.length)walk(n.c[((cyc%n.c.length)+n.c.length)%n.c.length],cyc,start,dur,out)}
  else if(n.t==="fast"){const d=dur/n.n;for(let k=0;k<n.n;k++)walk(n.c,cyc,start+k*d,d,out)}
}
const TREES=new Map();
function barEvents(src,bar){
  if(typeof src!=="string"||src.length>400)return [];
  let t=TREES.get(src);if(!t){if(TREES.size>200)TREES.clear();t=parsePattern(src);TREES.set(src,t)}
  const out=[];walk(t,bar,0,1,out);return out;
}
const barMs=tempo=>240000/tempo;
function pendingAt(s){return s.epoch+(s.pending.atBar-s.barOffset)*barMs(s.tempo)}
function barTime(s,bar){if(s.pending&&bar>=s.pending.atBar)return pendingAt(s)+(bar-s.pending.atBar)*barMs(s.pending.tempo);return s.epoch+(bar-s.barOffset)*barMs(s.tempo)}
function barAt(s,t){if(s.pending){const at=pendingAt(s);if(t>=at)return s.pending.atBar+Math.floor((t-at)/barMs(s.pending.tempo))}return s.barOffset+Math.floor((t-s.epoch)/barMs(s.tempo))}
const partOf=(s,bar)=>s.pending&&bar>=s.pending.atBar?s.pending:s;

/* The same hand written grooves the band server holds, so the floor dances on its own outside a room. */
const GROOVES={
  "Click":{drums:"ck cl cl cl",bass:"~",lead:"~",pad:"~"},
  "Pocket":{drums:"bd ~ [~ bd] ~, ~ sd ~ sd, hh*8",bass:"<[a1 ~ a1 ~ ~ a1 c2 ~] [f1 ~ f1 ~ ~ f1 g1 ~]>",lead:"<[~ e4 ~ c4 ~ a3 ~ ~] [~ d4 ~ c4 ~ a3 g3 ~]>",pad:"~"},
  "Four Floor":{drums:"bd*4, ~ cp ~ cp, [~ oh]*4",bass:"<[~ e1]*4 [~ e1]*4 [~ g1]*4 [~ d1]*4>",lead:"<[e4 ~ g4 ~ b4 ~ g4 ~] [d4 ~ g4 ~ b4 ~ a4 ~]>",pad:"~"},
  "Half Time":{drums:"bd ~ ~ ~ ~ ~ bd ~, ~ ~ ~ ~ sd ~ ~ ~, hh*4",bass:"<[d1 ~ ~ ~ ~ ~ d1 ~] [bb0 ~ ~ ~ ~ ~ c1 ~]>",lead:"<[~ ~ a4 ~ f4 ~ ~ d4] [~ ~ g4 ~ f4 ~ e4 ~]>",pad:"<[d3,f3,a3] [bb2,d3,f3]>"}
};

/* ---------- audio, the band loop rebuilt on this phone ---------- */
let audioCtx=null,noiseBuffer=null;
function getAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();return audioCtx}
function noiseBuf(ctx){
  if(noiseBuffer&&noiseBuffer.sampleRate===ctx.sampleRate)return noiseBuffer;
  noiseBuffer=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
  const d=noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  return noiseBuffer;
}
function tone(ctx,dest,at,f0,f1,sweep,level,decay,type){
  const osc=ctx.createOscillator(),g=ctx.createGain();osc.type=type||"sine";
  osc.frequency.setValueAtTime(f0,at);if(f1!==f0)osc.frequency.exponentialRampToValueAtTime(f1,at+sweep);
  g.gain.setValueAtTime(level,at);g.gain.exponentialRampToValueAtTime(.001,at+decay);
  osc.connect(g);g.connect(dest);osc.start(at);osc.stop(at+decay+.02);
}
function hiss(ctx,dest,at,type,freq,q,level,decay){
  const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  src.buffer=noiseBuf(ctx);f.type=type;f.frequency.value=freq;f.Q.value=q;
  g.gain.setValueAtTime(level,at);g.gain.exponentialRampToValueAtTime(.001,at+decay);
  src.connect(f);f.connect(g);g.connect(dest);src.start(at,Math.random()*.5);src.stop(at+decay+.02);
}
function drumVoice(ctx,dest,name,at,vel){
  const v=vel/100;
  if(name==="bd")tone(ctx,dest,at,150,45,.11,.95*v,.3);
  else if(name==="sd"){hiss(ctx,dest,at,"highpass",1400,.7,.5*v,.17);tone(ctx,dest,at,200,160,.05,.35*v,.09,"triangle")}
  else if(name==="hh")hiss(ctx,dest,at,"highpass",7500,.7,.22*v,.045);
  else if(name==="oh")hiss(ctx,dest,at,"highpass",6500,.7,.22*v,.24);
  else if(name==="cp")hiss(ctx,dest,at,"bandpass",1500,1.2,.6*v,.13);
  else if(name==="ck")tone(ctx,dest,at,1600,1600,0,.4*v,.04);
  else if(name==="cl")tone(ctx,dest,at,1000,1000,0,.28*v,.04);
}
const hz=m=>440*Math.pow(2,(m-69)/12);
function bassVoice(ctx,dest,m,at,len,vel){
  const osc=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain(),end=at+len;
  osc.type="sawtooth";osc.frequency.value=hz(m);
  f.type="lowpass";f.Q.value=3;f.frequency.setValueAtTime(900,at);f.frequency.setTargetAtTime(260,at,.09);
  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.42*vel/100,at+.006);g.gain.setTargetAtTime(0,end,.03);
  osc.connect(f);f.connect(g);g.connect(dest);osc.start(at);osc.stop(end+.25);
}
function leadVoice(ctx,dest,m,at,len,vel){
  const amp=ctx.createGain(),f=ctx.createBiquadFilter(),end=at+len,peak=.15*vel/100;
  f.type="lowpass";f.Q.value=1.5;f.frequency.setValueAtTime(2600,at);f.frequency.setTargetAtTime(1100,at,.12);
  amp.gain.setValueAtTime(0,at);amp.gain.linearRampToValueAtTime(peak,at+.01);amp.gain.setTargetAtTime(peak*.5,at+.01,.1);amp.gain.setTargetAtTime(0,end,.05);
  [["sawtooth",-6,1],["square",6,.6]].forEach(sp=>{
    const osc=ctx.createOscillator(),g=ctx.createGain();osc.type=sp[0];osc.frequency.value=hz(m);osc.detune.value=sp[1];g.gain.value=sp[2]*.65;
    osc.connect(g);g.connect(f);osc.start(at);osc.stop(end+.5);
  });
  f.connect(amp);amp.connect(dest);
}
function padVoice(ctx,dest,m,at,len,vel){
  const g=ctx.createGain(),end=at+len,rise=Math.min(.4,len/3);
  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.07*vel/100,at+rise);g.gain.setTargetAtTime(0,end,.25);
  [-7,7].forEach(det=>{const osc=ctx.createOscillator();osc.type="triangle";osc.frequency.value=hz(m);osc.detune.value=det;osc.connect(g);osc.start(at);osc.stop(end+1.5)});
  g.connect(dest);
}

/* ---------- timeline: the room loop when joined, the demo loop otherwise ---------- */
const DEMO={state:{playing:true,tempo:104,epoch:localNow()+200,barOffset:0,groove:"Pocket",slots:Object.assign({},GROOVES.Pocket),pending:null}};
const ROOM={state:null,phones:0,hear:false};
const ROSTER={list:null};
const clock=createServerClock({send:m=>sync.send(m.type,m),onChange:()=>{renderBar();rebuildDancers()}});
const sync=createBandSocket({onStatus:s=>{
  if(s==="live")clock.start();else{clock.stop();ROOM.state=null;ROSTER.list=null}
  renderBar();rebuildDancers();
}});
function inRoom(){return sync.status==="live"&&clock.synced&&!!ROOM.state}
function timeline(){return inRoom()?{s:ROOM.state,now:clock.now(),room:true}:{s:DEMO.state,now:localNow(),room:false}}
function target(){const s=inRoom()?ROOM.state:DEMO.state;return s.pending||s}

/* ---------- moves: keyframed poses over one bar of four beats ----------
   x pelvis shift, y pelvis drop, l torso lean, h head tilt,
   aL aR arm raise from hanging (outward is positive), eL eR elbow bend,
   lx ly rx ry foot spots on the floor (feet stay planted unless a move lifts them), t facing for spins. */
const BASE={x:0,y:.015,l:0,h:0,aL:.2,eL:.35,aR:.2,eR:.35,lx:-.075,ly:0,rx:.075,ry:0,t:1};
const POSE_KEYS=Object.keys(BASE);
const CLAP={aL:.45,eL:-2.6,aR:.45,eR:-2.6};
const FISTS={aL:.7,eL:-2.2,aR:.7,eR:-2.2};
const HIPS={aL:.75,eL:-1.45,aR:.75,eR:-1.45};
function shimmyKeys(){const k=[[.25,{y:.07,lx:-.13,rx:.13,aL:1.3,eL:.4,aR:1.3,eR:.4}]];for(let i=2;i<16;i++)k.push([i*.25,{y:.07,lx:-.13,rx:.13,aL:1.3+(i%2?.12:-.12),eL:.4,aR:1.3+(i%2?-.12:.12),eR:.4,l:i%2?.08:-.08,h:i%2?-.12:.12}]);return k}
function waveKeys(){const k=[];for(let i=1;i<8;i++){const p=i*Math.PI/2;k.push([i*.5,{aL:1.45+.2*Math.sin(p),eL:.75*Math.sin(p-1.2),aR:1.45+.2*Math.sin(p+1.6),eR:.75*Math.sin(p+.4),x:.035*Math.sin(i*Math.PI/4),l:.05*Math.sin(p),h:.12*Math.sin(p+.6),y:.03}])}return k}
const MOVES={
  stepTouch:[[1,Object.assign({x:.07,l:.07,rx:.19,lx:.03,ly:.05,y:.04},CLAP)],[2,{y:.03}],[3,Object.assign({x:-.07,l:-.07,lx:-.19,rx:-.03,ry:.05,y:.04},CLAP)]],
  charleston:[[.5,{y:.06,lx:-.05,rx:.05,aL:.6,aR:.6,eL:.2,eR:.2}],[1,{rx:.18,ry:.14,y:.02,l:-.06,aL:1.35,eL:.2,aR:.15,eR:.6},"back"],[1.5,{y:.06,lx:-.05,rx:.05}],
    [2,{lx:-.06,rx:.03,ry:.11,y:.02,l:.05,aL:.15,aR:1.35,eR:.2},"back"],[2.5,{y:.06,lx:-.05,rx:.05}],[3,{lx:-.18,ly:.14,y:.02,l:.06,aR:1.35,eR:.2,aL:.15},"back"],[3.5,{y:.06}]],
  runningMan:[[.5,{ly:.18,lx:-.04,y:.05,aL:1.1,eL:1.6,aR:.05,eR:.8}],[1,{y:.03}],[1.5,{ry:.18,rx:.04,y:.05,aR:1.1,eR:1.6,aL:.05,eL:.8}],[2,{y:.03}],

const POOLS={
  drums:["pump","jumpClap","runningMan","kickBallChange","charleston","robot"],
  bass:["stepTouch","cabbage","runningMan","kickBallChange","charleston","sway"],
  lead:["discoPoint","wave","spin","shimmy","charleston","stepTouch"],
  pad:["sway","wave","stepTouch","spin","cabbage"]
};
const HOT=["jumpClap","spin","runningMan","charleston"];
const MIRROR_SWAP=[["aL","aR"],["eL","eR"]];
function mirrorPose(p){
  const m=Object.assign({},p);
  if("x" in p)m.x=-p.x;if("l" in p)m.l=-p.l;if("h" in p)m.h=-p.h;
  MIRROR_SWAP.forEach(([a,b])=>{delete m[a];delete m[b];if(b in p)m[a]=p[b];if(a in p)m[b]=p[a]});
  delete m.lx;delete m.rx;delete m.ly;delete m.ry;
  if("rx" in p)m.lx=-p.rx;if("lx" in p)m.rx=-p.lx;if("ry" in p)m.ly=p.ry;if("ly" in p)m.ry=p.ly;
  return m;
}
/* Fills each keyframe out to a full pose, with the standing pose at the start and end of the bar. */
const COMPILED={};
function compiled(name,mirror){
  const id=name+(mirror?"~m":"");
  if(COMPILED[id])return COMPILED[id];
  const keys=[[0,{}]].concat(MOVES[name]).concat([[4,{},"io"]]);
  const out=keys.map(k=>({t:k[0],ease:k[2]||"io",p:Object.assign({},BASE,mirror?mirrorPose(k[1]):k[1])}));
  COMPILED[id]=out;return out;
}
function ease(kind,u){
  if(kind==="out")return 1-Math.pow(1-u,3);
  if(kind==="back"){const c=1.9;return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2)}
  if(kind==="hold")return u<.72?0:1-Math.pow(1-(u-.72)/.28,3);
  return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
}
function poseAt(name,mirror,beat){
  const ks=compiled(name,mirror);
  let k=0;while(k<ks.length-2&&ks[k+1].t<=beat)k++;
  const a=ks[k],b=ks[k+1],u=Math.max(0,Math.min(1,(beat-a.t)/((b.t-a.t)||1))),e=ease(b.ease,u);
  const out={};POSE_KEYS.forEach(key=>out[key]=a.p[key]+(b.p[key]-a.p[key])*e);
  return out;
}

/* ---------- choreography: the same pick on every screen ---------- */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function slotDensity(slots,partState,bar){
  let n=0;
  slots.forEach(id=>{
    barEvents(partState.slots&&partState.slots[id],bar).forEach(ev=>{
      if(id==="drums"){if(ev.drum==="bd"||ev.drum==="sd"||ev.drum==="cp"||ev.drum==="ck")n++}
      else if(!ev.drum)n++;
    });
  });
  return n;
}
function rawPick(d,bar,groove,density){
  const pool=(POOLS[d.slots[0]]||POOLS.bass).concat(density>=7?HOT:[]);
  const h=hashStr(groove+"|"+bar+"|"+d.key);
  let name=pool[h%pool.length];
  if(d.char==="robot"&&(h>>>8)%3===0)name="robot";
  return {name:name,mirror:((h>>>4)&1)===1};
}
function pickMove(d,bar,groove,density){
  if(!d.playing)return {name:"idleTap",mirror:(bar&1)===1};
  if(density===0)return {name:"sway",mirror:(bar&1)===1};
  const now=rawPick(d,bar,groove,density),prev=rawPick(d,bar-1,groove,density);
  if(now.name===prev.name&&now.mirror===prev.mirror)now.mirror=!now.mirror;
  return now;
}

let DANCERS=[];

function prettyApp(a){

function rebuildDancers(){
  let specs=[];
  const live=sync.status==="live";
  if(live&&ROSTER.list){
    specs=ROSTER.list.filter(p=>p.app!==APP).map(p=>({key:p.app+":"+p.seat+":"+p.id,app:p.app,playing:!!p.playing}));
  }else if(live&&ROOM.phones>1){
    for(let i=0;i<Math.min(12,ROOM.phones-1);i++)specs.push({key:"phone:"+i,app:"phone",playing:true});
  }
  if(!specs.length)specs=SLOTS.map((s,i)=>({key:"house:"+i,app:"house",playing:true}));
  specs=specs.slice(0,12);
  const n=specs.length;
  DANCERS=specs.map((sp,i)=>{
    let d=dancerMap.get(sp.key);if(!d){d=newDancer(sp.key);dancerMap.set(sp.key,d)}
    d.app=sp.app;d.playing=sp.playing;
    d.slots=n<4?SLOTS.filter((s,j)=>j%n===i):[SLOTS[i%4]];
    const saved=keep(APP+"-char-"+sp.key);

/* ---------- hits from the loop push the dancers around ---------- */
function bump(sp,amt){sp.x=Math.max(-1.6,Math.min(1.6,sp.x+amt))}
function onHit(slot,ev,t){
  DANCERS.forEach(d=>{
    if(slot==="drums"&&ev.drum==="bd")bump(d.dip,d.playing?.35:.15);
    if(d.slots.indexOf(slot)<0||!d.playing)return;
    if(slot==="drums"){
      if(ev.drum==="bd"){bump(d.dip,.9);d.flash=Math.max(d.flash,.7)}
      else if(ev.drum==="sd"||ev.drum==="cp"){bump(d.pop,1);bump(d.nod,1);d.mouth=1;d.flash=1}
      else if(ev.drum==="hh")bump(d.nod,.25);
      else if(ev.drum==="oh"){bump(d.nod,.6);bump(d.pop,.3)}
      else if(ev.drum==="ck"){bump(d.dip,.6);d.flash=.8}
      else if(ev.drum==="cl")bump(d.nod,.35);
    }else if(ev.drum)return;
    else if(slot==="bass"){bump(d.dip,.6);d.bassSide=-d.bassSide;bump(d.hip,d.bassSide*.9);d.flash=Math.max(d.flash,.6)}
    else if(slot==="lead"){bump(d.pop,.45+Math.max(0,Math.min(1,(ev.note-55)/24))*.6);bump(d.nod,.5);d.mouth=Math.max(d.mouth,.7);d.flash=Math.max(d.flash,.6)}
    else if(slot==="pad"){if(t-d.lastPad>60){d.lastPad=t;d.padSide=-d.padSide;bump(d.sway,d.padSide*1.1);d.flash=Math.max(d.flash,.5)}}
  });
}
let scanT=0,scanRoom=null;
function scanHits(s,now,room){
  if(scanRoom!==room||!scanT||now<scanT||now-scanT>1000){scanT=now;scanRoom=room;return}
  for(let b=Math.max(barAt(s,scanT),s.barOffset);b<=barAt(s,now);b++){
    const t0=barTime(s,b),part=partOf(s,b),ms=barMs(part.tempo);
    SLOTS.forEach(id=>{
      barEvents(part.slots&&part.slots[id],b).forEach(ev=>{const t=t0+ev.pos*ms;if(t>scanT&&t<=now)onHit(id,ev,t)});
    });
  }
  scanT=now;
}

/* ---------- hear band: the loop played on this phone, a little ahead on the clock ---------- */
let bandCursor=0;
function bandTick(){
  if(!ROOM.hear||!audioCtx||audioCtx.state!=="running"){bandCursor=0;return}
  const tl=timeline(),s=tl.s;
  if(!s||!s.playing){bandCursor=0;return}
  const ctx=audioCtx,now=tl.now,horizon=now+160,late=-(ctx.outputLatency||0);
  if(bandCursor<now-50||bandCursor>horizon)bandCursor=now;
  for(let b=Math.max(barAt(s,bandCursor),s.barOffset);barTime(s,b)<horizon;b++){
    const t0=barTime(s,b),part=partOf(s,b),ms=barMs(part.tempo);
    SLOTS.forEach(id=>{
      barEvents(part.slots&&part.slots[id],b).forEach(ev=>{
        const t=t0+ev.pos*ms;if(t<bandCursor||t>=horizon)return;
        const at=Math.max(ctx.currentTime,ctx.currentTime+(t-now)/1000+late),len=ev.dur*ms/1000;
        if(id==="drums"){if(ev.drum)drumVoice(ctx,ctx.destination,ev.drum,at,ev.vel)}
        else if(ev.drum)return;
        else if(id==="bass")bassVoice(ctx,ctx.destination,ev.note,at,len*.9,ev.vel);
        else if(id==="lead")leadVoice(ctx,ctx.destination,ev.note,at,len*.85,ev.vel);
        else if(id==="pad")padVoice(ctx,ctx.destination,ev.note,at,len,ev.vel);
      });
    });
  }
  bandCursor=horizon;
}
setInterval(bandTick,25);

/* ---------- rig ---------- */
const DIM={hipH:.44,thigh:.235,shin:.235,torso:.30,neck:.035,head:.088,shW:.095,hipW:.05,upper:.16,fore:.15};
function ik(h,f,side){
  const L1=DIM.thigh,L2=DIM.shin;
  let dx=f.x-h.x,dy=f.y-h.y,d=Math.hypot(dx,dy);
  const max=L1+L2-.002;
  if(d>max){f={x:h.x+dx/d*max,y:h.y+dy/d*max};dx=f.x-h.x;dy=f.y-h.y;d=max}
  if(d<.05)d=.05;
  const a=(L1*L1-L2*L2+d*d)/(2*d),hh=Math.sqrt(Math.max(0,L1*L1-a*a));
  const px=h.x+a*dx/d,py=h.y+a*dy/d;
  return {knee:{x:px+side*hh*(-dy/d),y:py+side*hh*(dx/d)},foot:f};
}
function solve(p){
  const pel={x:p.x,y:DIM.hipH-p.y};
  const sl=Math.sin(p.l),cl=Math.cos(p.l);
  const chest={x:pel.x+sl*DIM.torso,y:pel.y+cl*DIM.torso};
  const perp={x:cl,y:-sl};
  const shL={x:chest.x-perp.x*DIM.shW,y:chest.y-perp.y*DIM.shW},shR={x:chest.x+perp.x*DIM.shW,y:chest.y+perp.y*DIM.shW};
  const hipL={x:pel.x-DIM.hipW,y:pel.y},hipR={x:pel.x+DIM.hipW,y:pel.y};
  function arm(sh,a,e,side){
    const t1=-Math.PI/2+side*a-p.l,t2=-Math.PI/2+side*(a+e)-p.l;
    const el={x:sh.x+Math.cos(t1)*DIM.upper,y:sh.y+Math.sin(t1)*DIM.upper};
    return {el:el,hand:{x:el.x+Math.cos(t2)*DIM.fore,y:el.y+Math.sin(t2)*DIM.fore}};
  }
  const armL=arm(shL,p.aL,p.eL,-1),armR=arm(shR,p.aR,p.eR,1);
  const legL=ik(hipL,{x:p.lx,y:p.ly},-1),legR=ik(hipR,{x:p.rx,y:p.ry},1);
  const ha=Math.PI/2-p.l-p.h,hd=DIM.neck+DIM.head;
  const head={x:chest.x+Math.cos(ha)*hd,y:chest.y+Math.sin(ha)*hd};
  return {pel,chest,shL,shR,hipL,hipR,armL,armR,legL,legR,head,lean:p.l+p.h,turn:p.t};
}

function drawBackdrop(horizon,floorY,tl){
  g.fillStyle="#eef6fe";g.fillRect(0,0,W,H);
  /* floor with perspective lines */
  const grad=g.createLinearGradient(0,horizon,0,H);grad.addColorStop(0,"#dbe9f8");grad.addColorStop(1,"#ffffff");
  g.fillStyle=grad;g.fillRect(0,horizon,W,H-horizon);
  g.strokeStyle="rgba(11,15,20,.18)";g.lineWidth=1;
  const vx=W/2,vy=horizon-H*.35;
  for(let i=-10;i<=10;i++){const bx=W/2+i*W/8;g.beginPath();g.moveTo(vx+(bx-vx)*((horizon-vy)/(H-vy)),horizon);g.lineTo(bx,H);g.stroke()}
  for(let k=0;k<7;k++){const y=horizon+(H-horizon)*Math.pow(k/6,1.8);g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  g.strokeStyle=INK;g.lineWidth=3;g.beginPath();g.moveTo(0,horizon);g.lineTo(W,horizon);g.stroke();
  /* curtains */
  const cw=Math.max(18,W*.06);
  [[0,1],[W,-1]].forEach(([x0,dir])=>{
    g.fillStyle="#1484e0";g.beginPath();g.moveTo(x0,0);g.lineTo(x0+dir*cw,0);
    g.quadraticCurveTo(x0+dir*cw*.55,horizon*.6,x0+dir*cw*.9,horizon+6);g.lineTo(x0,horizon+6);g.closePath();g.fill();
    g.lineWidth=3;g.strokeStyle=INK;g.stroke();
    g.strokeStyle="rgba(11,15,20,.35)";g.lineWidth=2;
    for(let f=1;f<3;f++){g.beginPath();g.moveTo(x0+dir*cw*f/3,0);g.quadraticCurveTo(x0+dir*cw*f/3*.6,horizon*.6,x0+dir*cw*f/3*.95,horizon+4);g.stroke()}
  });
  /* valance */
  const vh=Math.max(14,H*.045),sc=Math.max(24,W/12);
  g.fillStyle="#1484e0";g.beginPath();g.moveTo(0,0);g.lineTo(W,0);g.lineTo(W,vh);
  for(let x=W;x>0;x-=sc)g.quadraticCurveTo(x-sc/2,vh+sc*.45,x-sc,vh);
  g.closePath();g.fill();g.lineWidth=3;g.strokeStyle=INK;g.stroke();
  /* readout */
  let fs=Math.max(10,Math.min(22,Math.round(H*.026)));
  g.font="700 "+fs+"px Courier New, monospace";
  const room=W-cw*2-20,tw=g.measureText(tl.label).width;
  if(tw>room){fs=Math.max(8,Math.floor(fs*room/tw));g.font="700 "+fs+"px Courier New, monospace"}
  g.fillStyle=INK;g.textAlign="center";
  g.fillText(tl.label,W/2,vh+sc*.45+fs*1.6);
}

}

function drawDancer(d,J,cx,floorY,S,now){
  const look=LOOKS[d.char]||LOOKS.boy,col=PART_COLOR[d.slots[0]]||"#1484e0";
  const turn=Math.abs(J.turn)<.08?.08*Math.sign(J.turn||1):J.turn;
  const X=x=>cx+x*turn*S,Y=y=>floorY-y*S;
  const P=pt=>[X(pt.x),Y(pt.y)];
  const ow=Math.max(1.5,S*.012),limb=S*.052,arm=S*.04;
  const front=J.turn>.25,back=J.turn<-.25;
  d.sx=cx-S*.32;d.sw=S*.64;d.sy=Y(1.1);d.sh=floorY-d.sy;

  if(d.char==="cat"){
    const sw=d.sway.x*.12+Math.sin(now/260)*.05;
    const base=J.pel,tip={x:base.x+.17+sw,y:base.y+.2};
    g.lineCap="round";g.beginPath();g.moveTo(X(base.x),Y(base.y));
    g.quadraticCurveTo(X(base.x+.16),Y(base.y-.04),X(tip.x),Y(tip.y));
    g.strokeStyle=INK;g.lineWidth=S*.045+ow*2;g.stroke();g.strokeStyle=look.skin;g.lineWidth=S*.045;g.stroke();
  }
  /* legs and shoes */
  [[J.hipL,J.legL,-1],[J.hipR,J.legR,1]].forEach(([hip,leg,side])=>{
    stroke([P(hip),P(leg.knee),P(leg.foot)],limb,look.pants,ow);
    const fx=X(leg.foot.x),fy=Y(leg.foot.y);
    blob(fx+side*S*.022*turn,fy+S*.006,S*.05,S*.024,d.char==="cat"?look.glove:INK,ow*.8);
  });
  /* skirt */
  if(d.char==="girl"){
    const hp=J.pel,sp=.035+Math.abs(d.hip.x)*.02;
    g.beginPath();g.moveTo(X(hp.x-.07),Y(hp.y+.05));g.lineTo(X(hp.x+.07),Y(hp.y+.05));
    g.lineTo(X(hp.x+.13+sp),Y(hp.y-.12));g.quadraticCurveTo(X(hp.x),Y(hp.y-.15),X(hp.x-.13-sp),Y(hp.y-.12));g.closePath();
    g.fillStyle=col;g.fill();g.lineWidth=ow;g.strokeStyle=INK;g.stroke();
  }
  /* torso */
  const hw=d.char==="robot"?.075:.06;
  g.beginPath();g.moveTo(...P(J.shL));g.lineTo(...P(J.shR));
  g.lineTo(X(J.pel.x+hw),Y(J.pel.y-.01));g.lineTo(X(J.pel.x-hw),Y(J.pel.y-.01));g.closePath();
  g.fillStyle=d.char==="robot"?"#cfe0f0":col;g.fill();g.lineWidth=ow*1.2;g.strokeStyle=INK;g.stroke();
  if(d.char==="robot"){
    const c=J.chest,m={x:(c.x+J.pel.x)/2,y:(c.y+J.pel.y)/2+.04};
    [-1,0,1].forEach(i=>blob(X(m.x+i*.035),Y(m.y),S*.013,S*.013,d.flash>.4&&i===((Math.floor(now/180)%3)-1)?"#1484e0":["#e8542a","#0e9a64","#f2b51d"][i+1],ow*.6));
  }else if(front){
    stroke([[X(J.chest.x-.02),Y(J.chest.y-.01)],[X(J.chest.x),Y(J.chest.y-.05)],[X(J.chest.x+.02),Y(J.chest.y-.01)]],S*.008,"#ffffff",0);
  }
  /* neck and head */
  stroke([P(J.chest),P({x:(J.chest.x+J.head.x)/2,y:(J.chest.y+J.head.y)/2})],S*.03,look.skin,ow);
  const hx=X(J.head.x),hy=Y(J.head.y),R=DIM.head*S,rx=R*Math.max(.35,Math.abs(turn));
  if(d.char==="girl"){blob(hx,hy+R*.25,rx*1.18,R*1.05,"#5a2a14",ow)}
  if(d.char==="cat"){
    [-1,1].forEach(s=>{g.beginPath();g.moveTo(hx+s*rx*.85,hy-R*.35);g.lineTo(hx+s*rx*.55,hy-R*1.45);g.lineTo(hx+s*rx*.1,hy-R*.8);g.closePath();g.fillStyle=look.skin;g.fill();g.lineWidth=ow;g.strokeStyle=INK;g.stroke()});
  }
  if(d.char==="robot"){
    const ar=hy-R*1.05;stroke([[hx,hy-R],[hx,ar-R*.35]],S*.008,INK,0);
    blob(hx,ar-R*.45,S*.018,S*.018,d.flash>.3?"#1484e0":"#ffffff",ow);
    g.beginPath();g.roundRect?g.roundRect(hx-rx,hy-R,rx*2,R*2,R*.3):g.rect(hx-rx,hy-R,rx*2,R*2);
    g.fillStyle=look.skin;g.fill();g.lineWidth=ow*1.2;g.strokeStyle=INK;g.stroke();
  }else blob(hx,hy,rx,R,look.skin,ow*1.2);
  if(front)drawFace(d,hx,hy,rx,R,turn,now,ow);
  /* hats and hair on top */
  if(d.char==="boy"){
    const bw=rx*1.3,top=hy-R*.82;
    g.fillStyle="#ffffff";g.lineWidth=ow*1.2;g.strokeStyle=INK;
    g.beginPath();g.rect(hx-bw,top-R*.12,bw*2,R*.18);g.fill();g.stroke();
    g.beginPath();g.rect(hx-rx*.78,top-R*1.15,rx*1.56,R*1.05);g.fill();g.stroke();
    g.fillStyle="#1484e0";g.fillRect(hx-rx*.78+ow*.6,top-R*.42,rx*1.56-ow*1.2,R*.22);
  }else if(d.char==="girl"){
    g.beginPath();g.ellipse(hx,hy-R*.45,rx*1.05,R*.62,0,Math.PI,Math.PI*2);g.fillStyle="#5a2a14";g.fill();g.lineWidth=ow;g.strokeStyle=INK;g.stroke();
    const bx=hx+rx*.55,by=hy-R*.92;
    g.beginPath();g.moveTo(bx,by);g.lineTo(bx-R*.4,by-R*.28);g.lineTo(bx-R*.4,by+R*.28);g.closePath();g.moveTo(bx,by);g.lineTo(bx+R*.4,by-R*.28);g.lineTo(bx+R*.4,by+R*.28);g.closePath();
    g.fillStyle="#1484e0";g.fill();g.stroke();
  }
  /* arms in front of the body */
  [[J.shL,J.armL],[J.shR,J.armR]].forEach(([sh,a])=>{
    stroke([P(sh),P(a.el)],arm,d.char==="robot"?"#cfe0f0":col,ow);
    stroke([P(a.el),P(a.hand)],arm*.9,d.char==="robot"?look.pants:look.skin,ow);
    blob(X(a.hand.x),Y(a.hand.y),S*.03,S*.03,look.glove,ow);
  });
  if(back&&d.char==="boy"){}
}

function drawFace(d,hx,hy,rx,R,turn,now,ow){
  const sq=Math.max(.35,Math.abs(turn)),ex=rx*.38,ey=hy-R*.12;
  if(now>d.blinkAt){d.blink=1;d.blinkAt=now+2500+Math.random()*3500}
  const shut=d.blink>0;
  if(d.char==="robot"){
    g.fillStyle="#0a1828";g.fillRect(hx-rx*.75,ey-R*.22,rx*1.5,R*.42);
    const glow=d.flash>.5?"#e8542a":"#38b6ff";
    if(!shut){blob(hx-ex,ey,R*.13*sq,R*.13,glow,0);blob(hx+ex,ey,R*.13*sq,R*.13,glow,0)}
    g.fillStyle=INK;for(let i=-2;i<=2;i++)g.fillRect(hx+i*rx*.18-1,hy+R*.42,2,R*(.12+d.mouth*.18));
    return;
  }
  const lift=d.pop.x*R*.06;
  if(shut){
    stroke([[hx-ex-R*.13,ey],[hx-ex+R*.13,ey]],ow,INK,0);stroke([[hx+ex-R*.13,ey],[hx+ex+R*.13,ey]],ow,INK,0);
  }else if(d.char==="cat"){
    [-1,1].forEach(s=>{blob(hx+s*ex,ey,R*.16*sq,R*.2,"#f4e27a",ow*.7);blob(hx+s*ex,ey,R*.05*sq,R*.17,INK,0)});
  }else{
    [-1,1].forEach(s=>{blob(hx+s*ex,ey,R*.12*sq,R*.17,INK,0);blob(hx+s*ex+R*.04,ey-R*.05,R*.04,R*.04,"#ffffff",0)});
  }
  if(d.char!=="cat"){
    [-1,1].forEach(s=>stroke([[hx+s*ex-R*.14,ey-R*.3-lift],[hx+s*ex+R*.14,ey-R*.3-lift-s*R*.03*d.nod.x]],ow,INK,0));
  }else{
    g.strokeStyle=INK;g.lineWidth=ow*.6;
    [-1,1].forEach(s=>{for(let k=-1;k<=1;k++){g.beginPath();g.moveTo(hx+s*rx*.2,hy+R*.2+k*R*.08);g.lineTo(hx+s*rx*1.25,hy+R*.12+k*R*.2);g.stroke()}});
    blob(hx,hy+R*.15,R*.08,R*.06,"#e07090",0);
  }
  const mo=Math.max(0,Math.min(1,d.mouth)),my=hy+R*.45;
  if(mo>.25){blob(hx,my,R*.2*sq,R*(.08+mo*.17),"#7a1a2a",ow*.8)}
  else{g.beginPath();g.arc(hx,my-R*.12,R*.24*sq,Math.PI*.2,Math.PI*.8);g.strokeStyle=d.char==="girl"?"#c8305e":INK;g.lineWidth=ow;g.stroke()}
}

function drawTag(d,cx,y,S){
  const fs=Math.max(9,Math.min(14,S*.055));
  g.font="700 "+fs+"px Courier New, monospace";g.textAlign="center";
  const top=prettyApp(d.app),bot=d.playing?d.slots.map(s=>s.toUpperCase()).join(" + "):"WAITING";
  const w=Math.max(g.measureText(top).width,g.measureText(bot).width)+fs*1.2,h=fs*2.6;
  g.fillStyle="#ffffff";g.strokeStyle=INK;g.lineWidth=2;
  g.beginPath();g.rect(cx-w/2,y,w,h);g.fill();g.stroke();
  g.fillStyle=INK;g.fillText(top,cx,y+fs*1.1);
  g.fillStyle=d.playing?(PART_COLOR[d.slots[0]]||"#1484e0"):"#7a8da3";g.fillText(bot,cx,y+fs*2.25);
}

/* ---------- frame ---------- */
let lastFrame=0,freeBeat=0;
function frame(ts){
  const dt=Math.min(.1,(ts-(lastFrame||ts))/1000);lastFrame=ts;
  g.setTransform(DPR,0,0,DPR,0,0);
  const tl=timeline(),s=tl.s,now=tl.now,live=s&&s.playing;
  let bar=0,beat=0,tempo=target().tempo,groove=target().groove;
  if(live){
    bar=barAt(s,now);const start=barTime(s,bar),part=partOf(s,bar);
    tempo=part.tempo;groove=part.groove;
    beat=Math.max(0,Math.min(3.999,(now-start)/barMs(part.tempo)*4));
    scanHits(s,now,tl.room);
  }else{
    freeBeat+=dt*(tempo/60)*.5;bar=Math.floor(freeBeat/4);beat=freeBeat%4;scanT=0;
  }
  const k=170,c=13;
  DANCERS.forEach(d=>{
    SPRING_NAMES.forEach(n=>{const sp=d[n];sp.v+=(-k*sp.x-c*sp.v)*dt;sp.x+=sp.v*dt});
    d.flash*=Math.exp(-dt*5);d.mouth*=Math.exp(-dt*7);if(d.blink>0)d.blink-=dt*7;
    if(d.bar!==bar){
      d.bar=bar;
      const part=live?partOf(s,bar):null;
      const dens=live?slotDensity(d.slots,part,bar):0;
      d.density=dens;
      d.move=live?pickMove(d,bar,groove,dens):{name:d.playing?"sway":"idleTap",mirror:(bar&1)===1};
    }
  });

  const label=(tl.room?"ROOM "+sync.room.toUpperCase():"DEMO")+"  "+(live?"BAR "+(bar+1)+"  BEAT "+(Math.floor(beat)+1):"LOOP STOPPED")+"  "+groove.toUpperCase();
  const n=DANCERS.length,tall=H>W*.9,rows=(n>5||(tall&&n>=3))?2:1;
  const horizon=H*(rows>1?.4:.5),floorFront=H*.88,floorBack=H*(rows>1?.66:.88);
  drawBackdrop(horizon,floorFront,{label:label});
  /* One lineup across the floor. With two rows every other dancer steps back, so neighbours can overlap. */
  const layout=[],span=W*.9,colW=span/n,spread=rows>1?2:1;
  DANCERS.forEach((d,i)=>{
    const back=rows>1&&i%2===1,fy=back?floorBack:floorFront;
    const S=Math.min((fy-H*.12)/1.25,(colW*spread)/1.05)*(back?.82:1);
    layout.push({o:{d:d},cx:W*.05+colW*(i+.5),fy:fy,S:S});
  });
  layout.sort((a,b)=>a.fy-b.fy);
  layout.forEach(L=>drawSpot(L.cx,L.fy,L.S,L.o.d));
  layout.forEach(L=>{
    const d=L.o.d;
    const amp=live?(d.playing?.8+Math.min(.45,(d.density||0)*.04):.5):.55;
    const raw=poseAt(d.move.name,d.move.mirror,beat),p={};
    POSE_KEYS.forEach(key=>p[key]=key==="t"?raw.t:BASE[key]+(raw[key]-BASE[key])*amp);
    const ph=beat%1,bounce=(live&&d.playing?.028:.012)*(.5+.5*Math.cos(ph*Math.PI*2));
    p.y+=bounce+d.dip.x*.055;
    p.x+=d.hip.x*.035;p.l+=d.sway.x*.11;p.h+=d.nod.x*.12;
    p.aL+=d.pop.x*.4;p.aR+=d.pop.x*.4;
    if(p.ly===0&&p.y<0){const lift=-p.y;p.ly+=lift;p.ry+=lift}
    const J=solve(p);
    drawDancer(d,J,L.cx,L.fy,L.S,localNow());
    drawTag(d,L.cx,L.fy+L.S*.09,L.S);
  });
  requestAnimationFrame(frame);
}

/* ---------- controls ---------- */
const $=id=>document.getElementById(id);
function renderBar(){
  const st=sync.status,chip=$("status");
  let text,s;
  if(st==="off"){text="demo floor";s="demo"}
  else if(st==="live"&&clock.synced&&ROOM.state){
    const others=ROSTER.list?ROSTER.list.filter(p=>p.app!==APP).length:Math.max(0,ROOM.phones-1);
    text="room "+sync.room+(others?" "+others+" in band":" house troupe");s="live";
  }else{text=st==="live"?"syncing "+sync.room:st+" "+sync.room;s="wait"}
  chip.textContent=text;chip.dataset.s=s;
  $("join").textContent=st==="off"?"Join":"Leave";
  $("join").classList.toggle("blue",st==="off");
  const t=target(),cur=inRoom()?ROOM.state:DEMO.state;
  $("tempo").textContent=t.tempo;
  $("loop").textContent=cur.playing?"Stop":"Play";
  $("hear").classList.toggle("on",ROOM.hear);$("hear").textContent=ROOM.hear?"Hearing":"Hear band";
  const names=Object.keys(GROOVES),box=$("grooves");
  if(box.dataset.names!==names.join("|")){
    box.dataset.names=names.join("|");box.textContent="";
    names.forEach(nm=>{const b=document.createElement("button");b.className="btn";b.dataset.g=nm;b.textContent=nm;b.addEventListener("click",()=>setGroove(nm));box.appendChild(b)});
  }
  box.querySelectorAll(".btn").forEach(b=>b.classList.toggle("sel",b.dataset.g===t.groove));
}
function demoChange(fn){
  const s=DEMO.state,now=localNow(),bar=barAt(s,now);
  if(!s.playing){fn(s);renderBar();return}
  /* a demo change lands on the next bar line, the same as the room does */
  const at=barTime(s,bar+1);s.epoch=at;s.barOffset=bar+1;fn(s);renderBar();
}
function setGroove(nm){
  if(inRoom()){sync.send("transport",{action:"groove",groove:nm});return}
  demoChange(s=>{s.groove=nm;s.slots=Object.assign({},GROOVES[nm])});
}
function nudgeTempo(d){
  const t=target();const next=Math.max(50,Math.min(200,t.tempo+d));
  if(inRoom()){sync.send("transport",{action:"tempo",tempo:next});return}
  demoChange(s=>{s.tempo=next});
}
$("bpm-dn").addEventListener("click",()=>nudgeTempo(-4));
$("bpm-up").addEventListener("click",()=>nudgeTempo(4));
$("loop").addEventListener("click",()=>{
  if(inRoom()){
    if(ROOM.state.playing)sync.send("transport",{action:"stop"});
    else{ROOM.hear=true;getAudio().resume();sync.send("transport",{action:"start"});heartbeat()}
    renderBar();return;
  }
  const s=DEMO.state;
  if(s.playing)s.playing=false;else{s.playing=true;s.epoch=localNow()+150;s.barOffset=0}
  renderBar();
});
$("hear").addEventListener("click",()=>{
  ROOM.hear=!ROOM.hear;bandCursor=0;
  if(ROOM.hear){getAudio().resume();heartbeat()}
  renderBar();
});
$("join").addEventListener("click",()=>{
  if(sync.status!=="off"){sync.leave();renderBar();rebuildDancers();return}
  const code=cleanRoom($("room-code").value);
  if(!code){$("room-code").focus();return}
  $("room-code").value=code;sync.setRoom(code);
});
$("room-code").addEventListener("keydown",e=>{if(e.key==="Enter")$("join").click()});
$("menu-btn").addEventListener("click",e=>{e.stopPropagation();$("menu").classList.toggle("open")});
document.addEventListener("click",e=>{if(!$("menu").contains(e.target)&&e.target!==$("menu-btn"))$("menu").classList.remove("open")});

/* tap a dancer to change its look */
cv.addEventListener("click",e=>{
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  for(let i=DANCERS.length-1;i>=0;i--){
    const d=DANCERS[i];
    if(x>=d.sx&&x<=d.sx+d.sw&&y>=d.sy&&y<=d.sy+d.sh+d.sw*.4){
      d.char=CHARS[(CHARS.indexOf(d.char)+1)%CHARS.length];keep(APP+"-char-"+d.key,d.char);bump(d.dip,1);d.mouth=1;return;
    }
  }
});

/* fullscreen with an exit button, and a fallback for browsers that block it */
const stage=$("stage");
function enterFs(){
  $("menu").classList.remove("open");
  const req=stage.requestFullscreen||stage.webkitRequestFullscreen;
  const fallback=()=>{stage.classList.add("pseudo","fs");resize()};
  if(!req){fallback();return}
  try{const r=req.call(stage);if(r&&r.catch)r.catch(fallback)}catch(e){fallback()}
}
function exitFs(){
  stage.classList.remove("pseudo","fs");
  if(document.fullscreenElement||document.webkitFullscreenElement){const ex=document.exitFullscreen||document.webkitExitFullscreen;if(ex)ex.call(document)}
  resize();
}
function fsSync(){stage.classList.toggle("fs",!!(document.fullscreenElement||document.webkitFullscreenElement)||stage.classList.contains("pseudo"));resize()}
document.addEventListener("fullscreenchange",fsSync);document.addEventListener("webkitfullscreenchange",fsSync);
$("fs-open").addEventListener("click",enterFs);$("fs-menu").addEventListener("click",enterFs);$("fs-exit").addEventListener("click",exitFs);

/* ---------- band messages ---------- */
sync.on("pong",m=>clock.pong(m));
sync.on("loop",m=>{
  ROOM.state=m.state&&typeof m.state.tempo==="number"&&typeof m.state.epoch==="number"?m.state:null;
  if(typeof m.phones==="number")ROOM.phones=m.phones;
  scanT=0;renderBar();if(!ROSTER.list)rebuildDancers();
});
sync.on("roster",m=>{if(Array.isArray(m.phones)){ROSTER.list=m.phones;rebuildDancers()}});

/* ---------- start ---------- */
rebuildDancers();renderBar();
if(sync.room){$("room-code").value=sync.room;sync.connect()}
requestAnimationFrame(frame);
</script>
</body>
